:root{--green:#287da3;--ink:#17394d;--muted:#526b78;--line:#d8e7ed}*{box-sizing:border-box}body{margin:0;background:#f2f7fa;color:var(--ink);font:16px/1.6 system-ui,sans-serif}header{background:#145779;color:white;padding:24px max(5%,calc((100% - 980px)/2));font-size:13px;letter-spacing:1.5px;font-weight:700}main{max-width:980px;margin:32px auto;padding:0 18px}section{background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,42px);box-shadow:0 8px 30px #14577909}h1{font-size:clamp(28px,4vw,42px);line-height:1.17;margin:12px 0}h2{line-height:1.25}p{color:var(--muted)}.tag{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--green);font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:24px 0}.tile{border:1px solid var(--line);border-radius:12px;padding:16px}.tile b{display:block}.tile small{color:var(--muted)}button{font:inherit;font-weight:650;border:0;border-radius:9px;background:var(--green);color:white;padding:12px 20px;cursor:pointer}button.secondary{background:#e8f3f8;color:var(--green)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible+span{outline:3px solid #77a83e;outline-offset:3px}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:25px}.track{height:8px;background:#e0edf2;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--green);transition:width .2s}.steps{display:flex;gap:6px;margin:18px 0}.steps button{flex:1;padding:8px;background:#e8f2f5;color:var(--ink)}.steps button.active{background:var(--green);color:white}.steps button.done{border:2px solid var(--green)}fieldset{border:0;border-top:1px solid var(--line);padding:20px 0;margin:0;min-width:0}legend{float:left;width:100%;font-weight:600;margin-bottom:12px}.choices{clear:both;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.choice{position:relative;cursor:pointer}.choice input{position:absolute;opacity:0}.choice span{display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:74px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:11px;line-height:1.2}.choice span b{font-size:22px;margin-bottom:5px}.choice input:checked+span{background:#eaf5df;border:2px solid var(--green);color:var(--green)}.score{font-size:44px;font-weight:800;color:var(--green);line-height:1.1}.bar{height:10px;background:#e1edf2;border-radius:10px;overflow:hidden;margin:8px 0}.bar div{height:100%;background:var(--green)}.resultrow{display:flex;justify-content:space-between;gap:12px}.radar{max-width:520px;margin:auto}footer{text-align:center;color:var(--muted);font-size:12px;margin:24px}.error{color:#a32d25;font-weight:600} [hidden]{display:none!important}@media(max-width:520px){.choices{gap:4px}.choice span{padding:4px;font-size:10px}.choice span b{font-size:18px}}@media print{body{background:white}header,footer,.actions{display:none!important}main{margin:0;max-width:none}section{box-shadow:none;border:none;padding:0}.tile{break-inside:avoid}.radar{max-width:390px}h1{font-size:28px}}
header{display:flex;align-items:center;gap:24px;background:linear-gradient(110deg,#145779 0%,#287da3 65%,#397f40 100%);border-bottom:4px solid #87b94e}.project-logo{display:block;width:132px;height:auto;flex:none;border-radius:8px;background:white}.fill,.bar div{background:linear-gradient(90deg,#287da3,#69a642)}.choice input:checked+span{border-color:#397f40;color:#286b36}.steps button.done{border-color:#69a642}.tag{color:#397f40}@media(max-width:520px){header{gap:12px;padding:14px 5%;font-size:11px}.project-logo{width:90px}}

const dimensions=[
['IE','Inclusive Education and Differentiation','Inclusion',[
'identify the individual learning needs and participation barriers of adult learners.','adapt my teaching methods to learners’ prior knowledge, experiences, and abilities.','adapt instructional materials to different literacy, language, and learning levels.','make appropriate accessibility arrangements for adult learners with disabilities.','provide learners with different ways to participate in activities and demonstrate their learning.','create a learning environment in which learners from different cultural and social backgrounds feel safe, respected, and included.'], 'Audit participation barriers and redesign one activity using accessible materials and flexible ways to participate.'],
['SC','Integration of Sustainability into the Curriculum','Curriculum',[
'identify sustainability issues that are relevant to the adult education programme I deliver.','formulate clear and measurable learning outcomes related to sustainability.','integrate sustainability topics into the objectives and content of an adult education programme.','relate environmental sustainability topics to adult learners’ daily lives and occupational contexts.','design activities that connect local environmental issues with global sustainability challenges.','assess learners’ development in sustainability-related knowledge, skills, and practices.'],'Map sustainability topics to programme outcomes and design a measurable assessment linked to learners’ daily lives.'],
['ST','Sustainable Teaching Practices and Learning Environment','Teaching',[
'use learner-centred and participatory methods when teaching sustainability-related topics.','implement problem-based or project-based activities that encourage learners to develop solutions to environmental problems.','plan educational activities in ways that reduce unnecessary energy and material consumption.','select instructional materials by considering both their environmental impact and learners’ accessibility needs.','involve learners in developing environmentally responsible practices for the learning environment.','evaluate the environmental impact of my teaching practices and make appropriate improvements.'],'Pilot a participatory environmental project and review the energy and material use of your learning environment.'],
['CE','Circular Economy and Resource Management','Circular economy',[
'explain the main principles of the circular economy to adult learners.','guide learners in analysing the life cycle and environmental impact of a product or resource.','teach practical strategies for reducing consumption, reusing materials, repairing products, and recycling waste.','design learning activities based on reuse, repair, or upcycling.','assess resource use and waste generation within a learning environment.','support learners in developing circular-economy solutions to local resource or waste problems.'],'Explore product life cycles and organise a repair, reuse or waste-audit activity with learners.'],
['SE','Social Responsibility and Ethics','Ethics',[
'reflect on how my own values and beliefs influence my approach to sustainability education.','help learners examine the effects of environmental decisions on present and future generations.','encourage learners to consider how environmental problems and solutions affect different social groups.','take the needs of disadvantaged and vulnerable groups into account when teaching sustainability topics.','facilitate discussions about controversial sustainability issues while respecting different opinions and cultural values.','help learners evaluate the credibility of environmental information and identify misleading sustainability claims.'],'Use a case study to examine environmental justice and practise evaluating sustainability claims with learners.'],
['PD','Professional Development, Collaboration, and Transfer into Practice','Development',[
'identify my strengths and professional development needs in inclusive and sustainable education.','set appropriate professional learning goals related to inclusive and sustainable education.','identify and use reliable sources and current good practices to improve my teaching.','adapt newly learned inclusive and sustainable teaching methods to my own adult education context.','evaluate the effectiveness of my practices by using learner feedback and other relevant evidence.','collaborate with colleagues and external stakeholders to develop and disseminate inclusive and sustainable education practices.'],'Set a professional learning goal, collaborate with a colleague and evaluate a new practice using learner feedback.']];
const labels=['Not at all capable','Slightly capable','Moderately capable','Very capable','Completely capable'];let a=Array(36).fill(0),page=0;const app=document.getElementById('app');const count=()=>a.filter(Boolean).length;const complete=i=>a.slice(i*6,i*6+6).every(Boolean);function scrollTopPage(){window.scrollTo(0,0)}
function welcome(){app.innerHTML=`<section><div class="tag">Professional learning • 36 items</div><h1>Perceived Competence Scale for Inclusive and Sustainable Adult Education</h1><p>Reflect on your current capabilities across six dimensions of adult education and identify opportunities for professional development.</p><div class="grid">${dimensions.map((d,i)=>`<div class="tile"><small>DIMENSION 0${i+1} · 6 ITEMS</small><b>${d[1]}</b></div>`).join('')}</div><h2>Instructions</h2><p>Please indicate how capable you believe you are of performing each of the following practices in adult education settings.</p><p>${labels.map((l,i)=>`${i+1} — ${l}`).join(' · ')}</p><p>This is a self-reflection tool, not a certification or a test of demonstrated competence. Your responses are not transmitted or stored on a server.</p><button onclick="show(0)">${count()?'Continue assessment':'Start assessment'} →</button></section>`;scrollTopPage()}
function show(i){page=i;app.innerHTML=`<section><div class="tag">Self-assessment · Dimension ${i+1} of 6</div><p id="progressText">${count()} of 36 items completed</p><div class="track" role="progressbar" aria-label="Assessment progress" aria-valuemin="0" aria-valuemax="36" aria-valuenow="${count()}"><div class="fill" style="width:${count()/36*100}%"></div></div><nav class="steps" aria-label="Dimensions">${dimensions.map((d,j)=>`<button class="${j===i?'active':''} ${complete(j)?'done':''}" aria-label="Dimension ${j+1}: ${d[1]}" ${j===i?'aria-current="step"':''} onclick="show(${j})">${j+1}</button>`).join('')}</nav><h2>${dimensions[i][1]}</h2><p>Choose one response for every statement.</p>${dimensions[i][3].map((q,j)=>{let k=i*6+j;return `<fieldset><legend>${dimensions[i][0]}${j+1}. I can ${q}</legend><div class="choices">${labels.map((l,n)=>`<label class="choice"><input type="radio" name="q${k}" value="${n+1}" ${a[k]===n+1?'checked':''} onchange="answer(${k},${n+1})"><span><b>${n+1}</b>${l}</span></label>`).join('')}</div></fieldset>`}).join('')}<p id="err" class="error" role="alert"></p><div class="actions"><button class="secondary" onclick="${i?'show('+(i-1)+')':'welcome()'}">← Back</button><button onclick="next()">${i===5?'View my results':'Next dimension'} →</button></div></section>`;scrollTopPage()}
function answer(k,v){a[k]=v;document.getElementById('progressText').textContent=`${count()} of 36 items completed`;document.querySelector('.fill').style.width=count()/36*100+'%';document.querySelector('.track').setAttribute('aria-valuenow',count());document.querySelectorAll('.steps button').forEach((b,i)=>b.classList.toggle('done',complete(i)));document.getElementById('err').textContent=''}function next(){if(!complete(page)){document.getElementById('err').textContent='Please answer all six items in this dimension.';return}if(page<5)show(page+1);else if(count()===36)results();else show(dimensions.findIndex((d,i)=>!complete(i)))}
function radar(m){let p=(i,r)=>[260+Math.sin(i*Math.PI/3)*r,205-Math.cos(i*Math.PI/3)*r];let poly=r=>dimensions.map((d,i)=>p(i,r).join(',')).join(' ');return `<svg viewBox="0 0 520 410" role="img" aria-label="Radar chart of six competence means from 0 to 5" style="width:100%">${[1,2,3,4,5].map(n=>`<polygon points="${poly(n*29)}" fill="none" stroke="#c9dce5"/><text x="265" y="${205-n*29+12}" font-size="10" fill="#526b78">${n}</text>`).join('')}${dimensions.map((d,i)=>{let [x,y]=p(i,145),[lx,ly]=p(i,166);return `<line x1="260" y1="205" x2="${x}" y2="${y}" stroke="#c9dce5"/><text x="${lx}" y="${ly}" text-anchor="middle" font-size="12" fill="#17394d">${d[2]}</text>`}).join('')}<polygon points="${m.map((v,i)=>p(i,v*29).join(',')).join(' ')}" fill="#287da340" stroke="#287da3" stroke-width="3"/>${m.map((v,i)=>{let [x,y]=p(i,v*29);return `<circle cx="${x}" cy="${y}" r="4" fill="#287da3"/>`}).join('')}</svg>`}
function results(){if(count()!==36)return;let m=dimensions.map((d,i)=>a.slice(i*6,i*6+6).reduce((s,v)=>s+v,0)/6),mean=a.reduce((s,v)=>s+v,0)/36;let order=[0,1,2,3,4,5].sort((i,j)=>m[i]-m[j]);app.innerHTML=`<section><div class="tag">Your competence profile</div><h1>Self-assessment results</h1><div class="tile"><small>Overall perceived competence · Mean of 36 responses</small><div class="score">${mean.toFixed(2)} <small style="font-size:18px">/ 5</small></div></div><div class="radar">${radar(m)}</div><h2>Dimension scores</h2><div class="grid">${dimensions.map((d,i)=>`<div class="tile"><div class="resultrow"><b>${d[1]}</b><strong>${m[i].toFixed(2)}</strong></div><div class="bar"><div style="width:${m[i]/5*100}%"></div></div><small>Mean of 6 items · scale 1–5</small></div>`).join('')}</div><h2>Professional development suggestions</h2><p>Start with your relatively lowest-scoring dimensions. These suggestions are formative, not diagnostic.</p>${order.slice(0,2).map(i=>`<div class="tile"><b>${dimensions[i][1]} · ${m[i].toFixed(2)}/5</b><p>${dimensions[i][4]}</p></div>`).join('')}<h2>Item-level reflection</h2>${dimensions.map((d,i)=>`<div class="tile" style="margin-bottom:10px"><b>${d[1]}</b>${d[3].map((q,j)=>`<p>${d[0]}${j+1}. I can ${q} <strong>${a[i*6+j]}/5</strong></p>`).join('')}</div>`).join('')}<p>All items are equally weighted. No reverse-scored items. Scores reflect perceived competence only; no empirically validated cut-offs or norms have been applied. Equal lowest scores are ordered by questionnaire order.</p><div class="actions"><button class="secondary" onclick="show(0)">Review answers</button><button class="secondary" onclick="exportCSV()">Export CSV</button><button onclick="window.print()">Print / Save PDF</button><button class="secondary" onclick="if(confirm('Clear all responses and restart?')){a.fill(0);welcome()}">Retake assessment</button></div></section>`;scrollTopPage()}
function exportCSV(){let rows=[['Dimension','Item','Statement','Response','Response label']];dimensions.forEach((d,i)=>d[3].forEach((q,j)=>rows.push([d[1],d[0]+(j+1),'I can '+q,a[i*6+j],labels[a[i*6+j]-1]])));let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));let link=document.createElement('a');link.href=url;link.download='competence-self-assessment.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}welcome();</script></body></html>
